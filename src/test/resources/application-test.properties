# Tests use their own local database (TEST_DB_*), rebuilt on every run. They deliberately ignore DB_*
# from .env, which may point at a hosted database such as Railway.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/ExpenseTrackerSystem_test}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=create-drop
