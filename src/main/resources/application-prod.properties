# Production. No defaults for secrets, so a missing variable stops startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
app.auth.mail-from=${SMTP_FROM}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.log-codes=false
app.demo.seed=false

# API docs are off in production unless SWAGGER_ENABLED=true.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
