# Local development stack: docker compose -f compose.dev.yml up --build
#   API          http://localhost:8080/api   (Swagger: /swagger-ui.html)
#   Email inbox  http://localhost:8025       (sign-in codes land here)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ExpenseTrackerSystem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]   # 5433 so it doesn't clash with a Postgres already on the host
    volumes: [dev-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ExpenseTrackerSystem"]
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit:v1.20.0
    ports: ["8025:8025"]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_DEMO_SEED: "true"
      DB_URL: jdbc:postgresql://db:5432/ExpenseTrackerSystem
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      SMTP_FROM: no-reply@expense-tracker.local
    ports: ["8080:8080"]

volumes:
  dev-db:
