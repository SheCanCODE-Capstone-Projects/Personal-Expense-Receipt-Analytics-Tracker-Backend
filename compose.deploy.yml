# Staging and production stack. Each server keeps its own .env next to this file
# (see deploy/env.staging.example and deploy/env.production.example).
# deploy/remote-deploy.sh runs it with IMAGE_TAG set to the release being deployed.
services:
  # Bundled database, started only when .env has no DB_URL (remote-deploy.sh enables the profile).
  # With DB_URL set (e.g. Railway or another managed PostgreSQL), this container is not started.
  db:
    image: postgres:16-alpine
    profiles: [bundled-db]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  app:
    image: ${IMAGE:?set IMAGE in .env}:${IMAGE_TAG:?IMAGE_TAG is set by the deploy script}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy, required: false }
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?set SPRING_PROFILES_ACTIVE to staging or prod}
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB:-}}
      DB_USERNAME: ${DB_USERNAME:-${POSTGRES_USER:-}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
      # Email through Brevo: BREVO_API_KEY (HTTP API), or SMTP_USERNAME/SMTP_PASSWORD for its SMTP relay.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM in .env (a sender verified in Brevo)}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Expense Tracker}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      # Optional: set AUTH_COOKIE_SAME_SITE=None when the frontend is served from a different site than the API.
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
    expose: ["8080"]

  # HTTPS in front of the API; Caddy obtains and renews the certificate for DOMAIN automatically.
  proxy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
