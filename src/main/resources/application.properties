spring.application.name=ExpenseTracker
# Local runs (IDE or mvnw) read KEY=VALUE pairs from ./.env if it exists; real environment variables still win.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# ---- Database (defaults suit a local Postgres; staging/prod must set DB_* explicitly) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ExpenseTrackerSystem}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# ---- Email delivery for sign-in codes ----
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.auth.mail-from=${SMTP_FROM:no-reply@localhost}

# ---- Tokens: HS256 key for access/refresh JWTs (at least 32 bytes). Generate with: openssl rand -base64 48 ----
app.auth.jwt-secret=${JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-in-production}

# ---- HTTP ----
# Session tokens travel only in HttpOnly cookies. Secure cookies also work on http://localhost in current browsers.
# Use SameSite=None (with Secure) only if the frontend and API are on different sites in production.
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
# Comma-separated origins allowed to call /api/** from a browser (Vite dev server by default).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Operations: only the health endpoint is exposed, for container and load-balancer checks ----
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# An SMTP outage should not mark the API unhealthy and get the container restarted.
management.health.mail.enabled=false
